server.port=3000
spring.application.name=gateway

spring.cloud.gateway.routes[0].id=authservice
spring.cloud.gateway.routes[0].uri=lb://AUTHENTICATION/
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/lms/**

spring.cloud.gateway.routes[1].id=registrationservice
spring.cloud.gateway.routes[1].uri=lb://REGISTRATION/
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/lms/registration/**

spring.cloud.gateway.routes[2].id=courseservice
spring.cloud.gateway.routes[2].uri=lb://COURSE/
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/lms/courses/**

management.endpoints.web.exposure.include=*
management.endpoint.metrics.enabled=true
management.metrics.export.prometheus.enabled=true


